name: Minified deploy (gh-pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: minify-deploy
  cancel-in-progress: true
jobs:
  minify:
    # ubuntu-latest je od 19. 10. 2026 Ubuntu 26 — playwright 1.59 --with-deps na něm
    # selhává (apt závislosti). Stejný pin jako tests.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save html-minifier-terser
      # Minifikace PŘEPÍŠE index.html v pracovním stromu — browser testy
      # níže tedy servují a ověřují právě minifikovanou verzi.
      - run: node .github/minify.cjs
      - name: Playwright chromium (1. pokus)
        run: npx playwright install --with-deps chromium
      - name: Playwright chromium (retry — stazeni prohlizece obcas spadne na sitove fluke)
        if: failure()
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # Pozn.: node regression testy (npm test) se nespouštějí — čtou
      # zdrojový index.html a hledají v něm neodsazené top-level zavírací
      # závorky, které minifikace odstraňuje. Na mainu běží v tests.yml.
      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          git add -A
          git commit -m "minified deploy from ${GITHUB_SHA}" || echo "no changes"
          git push -f origin gh-pages
