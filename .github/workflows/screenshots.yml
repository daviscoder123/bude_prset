name: Screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/screenshots.cjs', '.github/workflows/screenshots.yml', 'index.html', 'README.md']
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Vygenerovat screenshoty
        run: node scripts/screenshots.cjs 2>&1 | tee /tmp/shot-out.txt
      - name: Commitnout snimky do repa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Auto: aktualizace screenshotů pro README [skip ci]"
            git push
          else
            echo "Zadne zmeny snimku."
          fi
      - name: Pri selhani zaloz issue s vystupem
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 60 /tmp/shot-out.txt > /tmp/shot-tail.txt || echo "bez vystupu" > /tmp/shot-tail.txt
          if ! gh issue list --state open --json title --jq '.[].title' | grep -q "Screenshots workflow selhal"; then
            gh issue create --title "Screenshots workflow selhal" --body-file /tmp/shot-tail.txt --label "" || true
          fi
