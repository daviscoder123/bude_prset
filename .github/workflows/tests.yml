name: Regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pri selhani testu vloz vystup jako komentar do PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --test tests/regression.test.cjs > /tmp/test-out.txt 2>&1 || true
          tail -n 80 /tmp/test-out.txt > /tmp/test-tail.txt
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/test-tail.txt
      - run: npx playwright install --with-deps chromium
      - name: Browser testy (vystup do souboru kvuli diagnose)
        run: npm run test:browser > /tmp/browser-out.txt 2>&1
      - name: Pri selhani browser testu vloz vystup jako komentar do PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tail -n 160 /tmp/browser-out.txt > /tmp/browser-tail.txt
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/browser-tail.txt
